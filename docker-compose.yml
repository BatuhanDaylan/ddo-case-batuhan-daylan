services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Veritabanı host'a açılmaz; yalnızca compose ağında erişilir.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      HTTP_ADDR: ":8080"
      JWT_SECRET: ${JWT_SECRET}
      DOC_SIGNING_KEY: ${DOC_SIGNING_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      SEED_DEMO: ${SEED_DEMO:-true}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-40}
      HASH_CONCURRENCY: ${HASH_CONCURRENCY:-4}
      # İzleme: OTEL_TRACES_EXPORTER=stdout ile her iz JSON olarak standart çıktıya yazılır (varsayılan: kapalı).
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Arayüz: http://localhost:3000 (nginx; /api isteklerini backend'e iletir, CORS gerekmez).
  frontend:
    build: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Veri üretici (şartname Bölüm 8). `docker compose --profile sim run --rm simulator <komut>`
  # Komutlar: seed | tokens | storm | check
  simulator:
    build: ./backend
    profiles: ["sim"]
    entrypoint: ["simulator"]
    command: ["seed"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      API_URL: http://backend:8080
    volumes:
      - simdata:/data
    depends_on:
      backend:
        condition: service_healthy

  # Uçtan uca doğrulama: `make verify`. Her F-/T- kimliği için PASS/FAIL tablosu basar; hata varsa çıkış kodu ≠ 0.
  # Test verisini doğrudan veritabanına kurar (koşuya özgü ek ile), geri kalanı gerçek HTTP API üzerinden dener.
  verify:
    build: ./backend
    profiles: ["verify"]
    entrypoint: ["verify"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      API_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy

  # k6 yük testi: `make load`. Token dosyasını simulator üretir (/data/tokens.json).
  k6:
    image: grafana/k6:0.54.0
    profiles: ["load"]
    command: ["run", "/scripts/enroll.js"]
    environment:
      API_URL: http://backend:8080
      STUDENTS: ${LOAD_STUDENTS:-5000}
    volumes:
      - ./scripts/k6:/scripts:ro
      - simdata:/data
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  simdata:

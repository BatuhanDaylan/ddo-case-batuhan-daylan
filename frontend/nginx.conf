# Statik arayüzü sunar ve /api isteklerini aynı kaynak (origin) üzerinden API'ye iletir (CORS gerekmez).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API: /api/health -> backend:8080/health
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # SPA: bilinmeyen yollar index.html'e düşer (örn. /verify/{kod}).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hash'li statik dosyalar uzun süre önbelleğe alınabilir.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}
